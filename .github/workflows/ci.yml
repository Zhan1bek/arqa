name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: format · lint · types · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  smoke:
    name: API smoke (live server)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start server and check the example day from the task
        env:
          PORT: 3000
          DB_PATH: ':memory:'
        run: |
          npm run start -w @diary/server &
          for i in $(seq 1 30); do curl -sf localhost:3000/health && break; sleep 1; done
          summary=$(curl -sf localhost:3000/api/days/2026-10-01 | jq -c .summary)
          echo "$summary"
          test "$summary" = '{"trips":2,"revenue":3900,"commission":585,"net":3315,"cash":1500,"card":2400}'

  web-build:
    name: mobile app builds (web export)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run export:web -w @diary/mobile
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/mobile/dist
          retention-days: 7
